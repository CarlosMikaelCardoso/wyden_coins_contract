simpleArgs: &simple-args
  initialMoney: 200
  moneyToTransfer: 100
  numberOfAccounts: &number-of-accounts 20

test:
  name: facicoin-resgatar-benchmark
  description: Teste de carga da funcao resgatar
  workers:
    number: 5
  rounds:
    - label: resgatar
      description: Executando resgatar
      txNumber: *number-of-accounts
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper_besu/resgatar.js
        arguments: *simple-args
