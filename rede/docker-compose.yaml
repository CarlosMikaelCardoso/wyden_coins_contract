services:
  node1:
    image: besu-image-local:1.0
    container_name: node1
    network_mode: host
    command: '--data-path=/opt/besu/data --genesis-file=/opt/besu/genesis.json --rpc-http-enabled
      --rpc-http-api=ETH,NET,QBFT,ADMIN,EEA,WEB3,TRACE,DEBUG,TXPOOL,PERM --host-allowlist="*"
      --rpc-http-cors-origins="all" --profile=ENTERPRISE --metrics-enabled --rpc-http-host=0.0.0.0
      --rpc-ws-api=EEA,WEB3,ETH,NET,TRACE,DEBUG,ADMIN,TXPOOL,PERM,QBFT --data-storage-format=BONSAI    --min-gas-price=0  --rpc-ws-enabled=true  --rpc-ws-port=8645  --tx-pool-limit-by-account-percentage=1  --tx-pool-max-size=4096  --metrics-port=9545
      --p2p-port=30303 --rpc-http-port=8545 --permissions-nodes-config-file=/opt/besu/data/permissions_config.toml
      --permissions-accounts-config-file=/opt/besu/data/permissions_config.toml --rpc-ws-host=0.0.0.0 '
    volumes:
    - ./genesis.json:/opt/besu/genesis.json
    - ./Permissioned-Network/Node-1/data:/opt/besu/data
  node2:
    image: besu-image-local:1.0
    container_name: node2
    network_mode: host
    command: '--data-path=/opt/besu/data --genesis-file=/opt/besu/genesis.json --bootnodes=""
      --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,ADMIN,EEA,WEB3,TRACE,DEBUG,TXPOOL,PERM
      --host-allowlist="*" --rpc-http-cors-origins="all" --profile=ENTERPRISE --metrics-enabled
      --rpc-http-host=0.0.0.0 --rpc-ws-api=EEA,WEB3,ETH,NET,TRACE,DEBUG,ADMIN,TXPOOL,PERM,QBFT
      --data-storage-format=BONSAI    --min-gas-price=0  --rpc-ws-enabled=true  --rpc-ws-port=8646  --tx-pool-limit-by-account-percentage=1  --tx-pool-max-size=4096  --metrics-port=9546
      --p2p-port=30304 --rpc-http-port=8546 --permissions-nodes-config-file=/opt/besu/data/permissions_config.toml
      --permissions-accounts-config-file=/opt/besu/data/permissions_config.toml --rpc-ws-host=0.0.0.0 '
    volumes:
    - ./genesis.json:/opt/besu/genesis.json
    - ./Permissioned-Network/Node-2/data:/opt/besu/data
  node3:
    image: besu-image-local:1.0
    container_name: node3
    network_mode: host
    command: '--data-path=/opt/besu/data --genesis-file=/opt/besu/genesis.json --bootnodes=""
      --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,ADMIN,EEA,WEB3,TRACE,DEBUG,TXPOOL,PERM
      --host-allowlist="*" --rpc-http-cors-origins="all" --profile=ENTERPRISE --metrics-enabled
      --rpc-http-host=0.0.0.0 --rpc-ws-api=EEA,WEB3,ETH,NET,TRACE,DEBUG,ADMIN,TXPOOL,PERM,QBFT
      --data-storage-format=BONSAI    --min-gas-price=0  --rpc-ws-enabled=true  --rpc-ws-port=8647  --tx-pool-limit-by-account-percentage=1  --tx-pool-max-size=4096  --metrics-port=9547
      --p2p-port=30305 --rpc-http-port=8547 --permissions-nodes-config-file=/opt/besu/data/permissions_config.toml
      --permissions-accounts-config-file=/opt/besu/data/permissions_config.toml --rpc-ws-host=0.0.0.0 '
    volumes:
    - ./genesis.json:/opt/besu/genesis.json
    - ./Permissioned-Network/Node-3/data:/opt/besu/data
  node4:
    image: besu-image-local:1.0
    container_name: node4
    network_mode: host
    command: '--data-path=/opt/besu/data --genesis-file=/opt/besu/genesis.json --bootnodes=""
      --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,ADMIN,EEA,WEB3,TRACE,DEBUG,TXPOOL,PERM
      --host-allowlist="*" --rpc-http-cors-origins="all" --profile=ENTERPRISE --metrics-enabled
      --rpc-http-host=0.0.0.0 --rpc-ws-api=EEA,WEB3,ETH,NET,TRACE,DEBUG,ADMIN,TXPOOL,PERM,QBFT
      --data-storage-format=BONSAI    --min-gas-price=0  --rpc-ws-enabled=true  --rpc-ws-port=8648  --tx-pool-limit-by-account-percentage=1  --tx-pool-max-size=4096  --metrics-port=9548
      --p2p-port=30306 --rpc-http-port=8548 --permissions-nodes-config-file=/opt/besu/data/permissions_config.toml
      --permissions-accounts-config-file=/opt/besu/data/permissions_config.toml --rpc-ws-host=0.0.0.0 '
    volumes:
    - ./genesis.json:/opt/besu/genesis.json
    - ./Permissioned-Network/Node-4/data:/opt/besu/data
networks:
