services:
  besu-node:
    image: ${BESU_IMAGE:-hyperledger/besu:24.7.0}
    container_name: ${NODE_NAME:-besu-node}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/opt/besu/data
      - ./genesis.json:/opt/besu/genesis.json
      - ./permissions_config.toml:/opt/besu/permissions_config.toml
    env_file:
      - .env
    command: ${BESU_ARGS}
